[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntheticforge-ai"
version = "0.5.0"
description = "Local-first, system-aware synthetic test-data platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "faker>=30,<40",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "playwright>=1.50,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql>=1.1,<2"]
sqlserver = ["pyodbc>=5,<6"]
oracle = ["oracledb>=2.5,<4"]
snowflake = ["snowflake-connector-python>=3.12,<5"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]
redshift = ["psycopg[binary]>=3.2,<4"]
parquet = ["pyarrow>=18,<22"]
all-connectors = [
  "psycopg[binary]>=3.2,<4", "pymysql>=1.1,<2", "pyodbc>=5,<6", "oracledb>=2.5,<4",
  "snowflake-connector-python>=3.12,<5", "google-cloud-bigquery>=3.25,<4", "pyarrow>=18,<22"
]

[project.scripts]
syntheticforge = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.connectors", "app.agent"]
include-package-data = true

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
