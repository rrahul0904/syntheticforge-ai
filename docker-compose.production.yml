services:
  syntheticforge:
    build:
      context: .
      args:
        VCS_REF: ${SYNTHETICFORGE_APPLICATION_SHA:?set the exact source commit SHA before building}
    image: syntheticforge-ai:1.0.0-rc1
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SYNTHETICFORGE_ENV: production
      SYNTHETICFORGE_APPLICATION_SHA: ${SYNTHETICFORGE_APPLICATION_SHA:?set the exact source commit SHA before building}
      SYNTHETICFORGE_HOME: /data
      SYNTHETICFORGE_CORS_ORIGINS: ${SYNTHETICFORGE_CORS_ORIGINS:?set the public HTTPS origin}
      SYNTHETICFORGE_ADMIN_USERNAME: ${SYNTHETICFORGE_ADMIN_USERNAME:-admin}
      SYNTHETICFORGE_ADMIN_PASSWORD_HASH: ${SYNTHETICFORGE_ADMIN_PASSWORD_HASH:?generate a password hash first}
      SYNTHETICFORGE_API_TOKEN_SHA256: ${SYNTHETICFORGE_API_TOKEN_SHA256:?set a SHA-256 digest for an operator API token}
      SYNTHETICFORGE_OPERATOR_USERNAME: ${SYNTHETICFORGE_OPERATOR_USERNAME:-}
      SYNTHETICFORGE_OPERATOR_PASSWORD_HASH: ${SYNTHETICFORGE_OPERATOR_PASSWORD_HASH:-}
      SYNTHETICFORGE_SESSION_TTL_SECONDS: ${SYNTHETICFORGE_SESSION_TTL_SECONDS:-28800}
      SYNTHETICFORGE_REPLICAS: "1"
      SYNTHETICFORGE_TRUSTED_PROXY_IPS: ${SYNTHETICFORGE_TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      WEB_CONCURRENCY: "1"
      PORT: "8000"
    volumes:
      - syntheticforge-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).read()"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s
volumes:
  syntheticforge-data:
