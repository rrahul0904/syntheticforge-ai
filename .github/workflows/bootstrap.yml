name: One-time SyntheticForge repository bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand verified release files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap2/chunk00.b64 ]; then
            echo "Bootstrap already completed."
            exit 0
          fi
          cat .bootstrap2/chunk*.b64 | tr -d '\n' | base64 --decode > /tmp/syntheticforge-missing.tar.gz
          tar -xzf /tmp/syntheticforge-missing.tar.gz
          rm -rf .bootstrap2 .bootstrap .syntheticforge-init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No files to commit."
            exit 0
          fi
          git commit -m "feat: add complete SyntheticForge AI v0.5 release"
          git push origin HEAD:main
