name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Compile Python
        run: python -m compileall -q app tests scripts

      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js

      - name: Verify SQLite end-to-end roundtrip
        run: python scripts/demo_sqlite_roundtrip.py

      - name: CLI smoke test
        run: syntheticforge --help
